<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="360" fill="#FFFFFF"/>
  <text x="20" y="40" font-size="22" font-weight="700" fill="#1A1A1A">How Young Women Discover, Buy, and Resell</text>
  <text x="20" y="62" font-size="13" fill="#666666">Platform roles by market. Use these to choose the right format for each prompt card.</text>

  <!-- Column headers -->
  <text x="190" y="96" font-size="14" font-weight="700" fill="#2E5C8A">Discover</text>
  <text x="380" y="96" font-size="14" font-weight="700" fill="#2E5C8A">Research and Community</text>
  <text x="600" y="96" font-size="14" font-weight="700" fill="#2E5C8A">Buy</text>
  <text x="760" y="96" font-size="14" font-weight="700" fill="#2E5C8A">Resell</text>

  <!-- Arrows -->
  <line x1="300" y1="110" x2="330" y2="110" stroke="#999999" stroke-width="2"/>
  <line x1="530" y1="110" x2="560" y2="110" stroke="#999999" stroke-width="2"/>
  <line x1="700" y1="110" x2="730" y2="110" stroke="#999999" stroke-width="2"/>

  <!-- China row -->
  <rect x="20" y="118" width="160" height="66" rx="8" fill="#1A1A1A"/>
  <text x="100" y="146" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">China</text>
  <text x="100" y="168" font-size="11" fill="#CCCCCC" text-anchor="middle">Douyin, Xiaohongshu</text>
  <rect x="190" y="118" width="100" height="66" rx="6" fill="#EEF3F8"/>
  <text x="240" y="144" font-size="12" fill="#333333" text-anchor="middle">Douyin</text>
  <text x="240" y="162" font-size="12" fill="#333333" text-anchor="middle">short video</text>
  <rect x="330" y="118" width="170" height="66" rx="6" fill="#EEF3F8"/>
  <text x="415" y="144" font-size="12" fill="#333333" text-anchor="middle">Xiaohongshu notes</text>
  <text x="415" y="162" font-size="12" fill="#333333" text-anchor="middle">and "core" moodboards</text>
  <rect x="560" y="118" width="140" height="66" rx="6" fill="#EEF3F8"/>
  <text x="630" y="144" font-size="12" fill="#333333" text-anchor="middle">Taobao, Tmall,</text>
  <text x="630" y="162" font-size="12" fill="#333333" text-anchor="middle">livestreams</text>
  <rect x="730" y="118" width="150" height="66" rx="6" fill="#F7F7F5"/>
  <text x="805" y="150" font-size="12" fill="#666666" text-anchor="middle">Less documented</text>

  <!-- South Korea row -->
  <rect x="20" y="200" width="160" height="66" rx="8" fill="#1A1A1A"/>
  <text x="100" y="228" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">South Korea</text>
  <text x="100" y="250" font-size="11" fill="#CCCCCC" text-anchor="middle">TikTok, Instagram, YouTube</text>
  <rect x="190" y="200" width="100" height="66" rx="6" fill="#EEF3F8"/>
  <text x="240" y="226" font-size="12" fill="#333333" text-anchor="middle">TikTok</text>
  <text x="240" y="244" font-size="12" fill="#333333" text-anchor="middle">Reels, Shorts</text>
  <rect x="330" y="200" width="170" height="66" rx="6" fill="#EEF3F8"/>
  <text x="415" y="226" font-size="12" fill="#333333" text-anchor="middle">YouTube reviews</text>
  <text x="415" y="244" font-size="12" fill="#333333" text-anchor="middle">and styling challenges</text>
  <rect x="560" y="200" width="140" height="66" rx="6" fill="#EEF3F8"/>
  <text x="630" y="226" font-size="12" fill="#333333" text-anchor="middle">Instagram shopping,</text>
  <text x="630" y="244" font-size="12" fill="#333333" text-anchor="middle">Musinsa</text>
  <rect x="730" y="200" width="150" height="66" rx="6" fill="#EEF3F8"/>
  <text x="805" y="226" font-size="12" fill="#333333" text-anchor="middle">Bunjang, Karrot,</text>
  <text x="805" y="244" font-size="12" fill="#333333" text-anchor="middle">department resale</text>

  <!-- Japan row -->
  <rect x="20" y="282" width="160" height="66" rx="8" fill="#1A1A1A"/>
  <text x="100" y="310" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Japan</text>
  <text x="100" y="332" font-size="11" fill="#CCCCCC" text-anchor="middle">TikTok, Instagram</text>
  <rect x="190" y="282" width="100" height="66" rx="6" fill="#EEF3F8"/>
  <text x="240" y="308" font-size="12" fill="#333333" text-anchor="middle">TikTok</text>
  <text x="240" y="326" font-size="12" fill="#333333" text-anchor="middle">tutorials</text>
  <rect x="330" y="282" width="170" height="66" rx="6" fill="#EEF3F8"/>
  <text x="415" y="308" font-size="12" fill="#333333" text-anchor="middle">Instagram hashtag</text>
  <text x="415" y="326" font-size="12" fill="#333333" text-anchor="middle">carousels, thrift hauls</text>
  <rect x="560" y="282" width="140" height="66" rx="6" fill="#EEF3F8"/>
  <text x="630" y="308" font-size="12" fill="#333333" text-anchor="middle">Harajuku boutiques,</text>
  <text x="630" y="326" font-size="12" fill="#333333" text-anchor="middle">vintage shops</text>
  <rect x="730" y="282" width="150" height="66" rx="6" fill="#EEF3F8"/>
  <text x="805" y="308" font-size="12" fill="#333333" text-anchor="middle">Mercari, Rakuma</text>
</svg>
