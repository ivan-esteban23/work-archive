<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="360" fill="#FFFFFF"/>
  <text x="20" y="40" font-size="22" font-weight="700" fill="#1A1A1A">Price Tiers by Market (Local Currency)</text>
  <text x="20" y="62" font-size="13" fill="#666666">Indicative ranges for trend-driven pieces. Figures should be re-checked before publication.</text>

  <!-- Header -->
  <rect x="20" y="80" width="860" height="36" fill="#1A1A1A"/>
  <text x="34" y="104" font-size="14" font-weight="700" fill="#FFFFFF">Market</text>
  <text x="200" y="104" font-size="14" font-weight="700" fill="#FFFFFF">Budget</text>
  <text x="440" y="104" font-size="14" font-weight="700" fill="#FFFFFF">Mid-range</text>
  <text x="680" y="104" font-size="14" font-weight="700" fill="#FFFFFF">Premium</text>

  <!-- China row -->
  <rect x="20" y="116" width="860" height="72" fill="#F7F7F5"/>
  <text x="34" y="146" font-size="15" font-weight="700" fill="#1A1A1A">China</text>
  <text x="34" y="164" font-size="12" fill="#666666">Taobao, Tmall, Xiaohongshu</text>
  <text x="200" y="146" font-size="13" fill="#333333">Tops and skirts ¥50–200</text>
  <text x="200" y="164" font-size="13" fill="#333333">Dresses ¥150–400</text>
  <text x="440" y="146" font-size="13" fill="#333333">Dresses and coats</text>
  <text x="440" y="164" font-size="13" fill="#333333">¥800–2,500</text>
  <text x="680" y="146" font-size="13" fill="#333333">Above ¥3,000 per item</text>
  <text x="680" y="164" font-size="12" fill="#666666">or resale and investment</text>

  <!-- South Korea row -->
  <rect x="20" y="196" width="860" height="72" fill="#FFFFFF"/>
  <text x="34" y="226" font-size="15" font-weight="700" fill="#1A1A1A">South Korea</text>
  <text x="34" y="244" font-size="12" fill="#666666">Uniqlo, Top Ten, Musinsa</text>
  <text x="200" y="226" font-size="13" fill="#333333">Tops and skirts ₩20,000–60,000</text>
  <text x="200" y="244" font-size="13" fill="#333333">Outerwear ₩60,000–150,000</text>
  <text x="440" y="226" font-size="13" fill="#333333">Dresses and coats</text>
  <text x="440" y="244" font-size="13" fill="#333333">₩200,000–800,000</text>
  <text x="680" y="226" font-size="13" fill="#333333">Luxury via resale</text>
  <text x="680" y="244" font-size="12" fill="#666666">often 30–50% of retail</text>

  <!-- Japan row -->
  <rect x="20" y="276" width="860" height="72" fill="#F7F7F5"/>
  <text x="34" y="306" font-size="15" font-weight="700" fill="#1A1A1A">Japan</text>
  <text x="34" y="324" font-size="12" fill="#666666">Mercari, vintage districts</text>
  <text x="200" y="306" font-size="13" fill="#333333">Fast fashion, thrift</text>
  <text x="200" y="324" font-size="13" fill="#333333">¥1,000–5,000</text>
  <text x="440" y="306" font-size="13" fill="#333333">Designer streetwear and</text>
  <text x="440" y="324" font-size="13" fill="#333333">boutiques ¥8,000–30,000</text>
  <text x="680" y="306" font-size="13" fill="#333333">Selective new purchases</text>
  <text x="680" y="324" font-size="12" fill="#666666">or resale</text>
</svg>
