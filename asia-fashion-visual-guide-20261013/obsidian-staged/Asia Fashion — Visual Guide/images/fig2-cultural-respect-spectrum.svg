<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C6E8C"/>
      <stop offset="35%" stop-color="#3D9970"/>
      <stop offset="65%" stop-color="#E0A030"/>
      <stop offset="100%" stop-color="#B0413E"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="#FFFFFF"/>
  <text x="20" y="40" font-size="22" font-weight="700" fill="#1A1A1A">Styling Traditional Garments: A Respect Spectrum</text>
  <text x="20" y="62" font-size="13" fill="#666666">Use this to decide how a traditional-inspired look should be framed in editorial and prompts.</text>

  <rect x="60" y="110" width="780" height="34" rx="17" fill="url(#spectrum)"/>

  <!-- Markers -->
  <line x1="170" y1="104" x2="170" y2="150" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="390" y1="104" x2="390" y2="150" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="610" y1="104" x2="610" y2="150" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="800" y1="104" x2="800" y2="150" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Labels above bar -->
  <text x="60" y="98" font-size="13" fill="#4C6E8C" font-weight="700">Ceremonial</text>
  <text x="840" y="98" font-size="13" fill="#B0413E" font-weight="700" text-anchor="end">Costume</text>

  <!-- Column 1: Ceremonial -->
  <text x="170" y="172" font-size="15" font-weight="700" fill="#4C6E8C" text-anchor="middle">Formal and Ceremonial</text>
  <text x="170" y="192" font-size="12" fill="#333333" text-anchor="middle">Bridal furisode, wedding hanbok,</text>
  <text x="170" y="208" font-size="12" fill="#333333" text-anchor="middle">formal hanfu. Keep event context.</text>

  <!-- Column 2: Everyday fusion (recommended) -->
  <text x="390" y="172" font-size="15" font-weight="700" fill="#2E7D5B" text-anchor="middle">Everyday Fusion (Preferred)</text>
  <text x="390" y="192" font-size="12" fill="#333333" text-anchor="middle">Cropped jeogori over denim, qipao-collar</text>
  <text x="390" y="208" font-size="12" fill="#333333" text-anchor="middle">tops, mamianqun with knitwear.</text>

  <!-- Column 3: Framed fantasy -->
  <text x="610" y="172" font-size="15" font-weight="700" fill="#A8741A" text-anchor="middle">Framed Fantasy</text>
  <text x="610" y="192" font-size="12" fill="#333333" text-anchor="middle">Concept art or editorial with</text>
  <text x="610" y="208" font-size="12" fill="#333333" text-anchor="middle">stated intent. Label it as such.</text>

  <!-- Column 4: Costume -->
  <text x="790" y="172" font-size="15" font-weight="700" fill="#B0413E" text-anchor="end">Costume</text>
  <text x="790" y="192" font-size="12" fill="#333333" text-anchor="end">Stacked garments from several</text>
  <text x="790" y="208" font-size="12" fill="#333333" text-anchor="end">cultures, sexualized cuts, generic</text>
  <text x="790" y="224" font-size="12" fill="#333333" text-anchor="end">"Asian cosplay" framing.</text>

  <text x="20" y="300" font-size="12" fill="#555555">Guidance drawn from the report's cultural-respect sections and from Chinese and Korean designer commentary on structural integrity.</text>
  <text x="20" y="318" font-size="11" fill="#888888">Position on the spectrum is an editorial judgment, not a fixed standard.</text>
</svg>
